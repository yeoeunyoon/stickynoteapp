<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Sticky Notes App</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-100">
    <main class="container px-4 py-8 mx-auto">
      <div class="max-w-4xl mx-auto">
        <div class="p-6 mb-8 bg-white shadow-lg rounded-xl">
          <textarea
            id="new-note"
            placeholder="Write your note here... (Press Enter to add)"
            rows="3"
            class="w-full p-4 text-lg transition-all duration-300 ease-in-out border-2 border-transparent rounded-lg resize-none focus:border-indigo-500"
          ></textarea>
        </div>

        <section
          id="notes-wall"
          class="min-h-[400px]"
        >
          <!-- Notes will be dynamically added here -->
        </section>
      </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 p-4 bg-white shadow-lg bg-opacity-90">
      <div class="flex flex-wrap justify-center max-w-4xl gap-6 mx-auto text-sm text-gray-600">
        <div class="flex items-center gap-2">
          <i class="fas fa-arrows-alt"></i>
          <span>Drag notes to rearrange</span>
        </div>
        <div class="flex items-center gap-2">
          <i class="fas fa-edit"></i>
          <span>Double-click to edit</span>
        </div>
        <div class="flex items-center gap-2">
          <i class="fas fa-palette"></i>
          <span>Click colors to change note style</span>
        </div>
        <div class="flex items-center gap-2">
          <i class="fas fa-keyboard"></i>
          <span>Shift + Enter for new line</span>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
